spring.application.name=Nail-BeautySalon
spring.jpa.hibernate.ddl-auto=update

# Database. Override with environment variables if you do not want to edit this file:
#   MYSQL_HOST, DB_USERNAME, DB_PASSWORD
spring.datasource.url = jdbc:mysql://${MYSQL_HOST:localhost}:3306/nail-beautysalondb?createDatabaseIfNotExist=true
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD:Cput@12345}

spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver


#spring.jpa.show-sql=true
#server.servlet.context-path=/nail-beautySalon
server.port=8080

# JWT configuration
app.jwt.secret=ThisIsADevSecretKeyForNailBeautySalonChangeMeInProductionUseAtLeast32BytesLong!
app.jwt.expiration-ms=86400000

# Time zone used to decide whether a booking slot is in the past
app.timezone=Africa/Johannesburg

# How many bookings one hourly time slot can hold (1 = a slot is "unavailable" once someone has booked it)
app.booking.capacity=1

# Admin login created on first start
app.admin.username=${ADMIN_USERNAME:admin@nailbeautysalon.co.za}
app.admin.password=${ADMIN_PASSWORD:Login@2026}

# ---------------------------------------------------------------------------
# E-mail (booking confirmations to customer + employees, contact-form messages)
# Until app.mail.enabled=true the e-mails are only written to the log.
# For Gmail: enable 2-step verification, create an "App password" and set:
#   MAIL_ENABLED=true  MAIL_USERNAME=yourname@gmail.com  MAIL_PASSWORD=<app password>
# ---------------------------------------------------------------------------
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# Extra inbox that always receives staff notifications (comma separated). All registered employees are e-mailed as well.
app.mail.staff-inbox=${STAFF_INBOX:}
app.salon.name=Nail & Beauty Salon

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Return the real validation message from the API
server.error.include-message=always
