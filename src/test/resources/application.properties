# Used by the automated tests only: an in-memory H2 database, so no MySQL is needed to run `mvn test`.
spring.application.name=Nail-BeautySalon-Test
spring.datasource.url=jdbc:h2:mem:salontest;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=ThisIsADevSecretKeyForNailBeautySalonChangeMeInProductionUseAtLeast32BytesLong!
app.jwt.expiration-ms=86400000
app.timezone=Africa/Johannesburg
app.booking.capacity=1
app.admin.username=admin@nailbeautysalon.co.za
app.admin.password=Login@2026
app.mail.enabled=false
app.salon.name=Nail & Beauty Salon
